# Bouwstraat van dpo-fg-tool.
#
# De volgorde is bewust: opmaak en statische analyse eerst, want die falen
# binnen een minuut en besparen de rest van de tijd. De platformmatrix draait
# als laatste, omdat die het duurst is.
#
# Er is geen publicatiestap. Releases worden handmatig vrijgegeven na een
# rookproef op alle drie de platforms; een pijplijn die zonder menselijke
# tussenkomst een binary bij klanten kan krijgen, introduceert precies het
# risico dat het productontwerp vermijdt.

name: kwaliteit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  opmaak-en-analyse:
    name: opmaak en statische analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # De workspace bevat sinds de grafische schil een Tauri-crate. Die bindt
      # tegen WebKitGTK, en zonder die koppen struikelt elke opdracht met
      # --workspace al bij glib-sys. Alleen op Linux: macOS levert WKWebView
      # mee en Windows haalt WebView2 zelf op.
      - name: systeembibliotheken voor de schil
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: opmaak
        run: cargo fmt --all -- --check

      - name: statische analyse
        # Waarschuwingen zijn fouten: een waarschuwing die blijft staan, leert
        # iedereen waarschuwingen negeren.
        #
        # In twee stappen, en dat heeft een reden. De feature custom-protocol
        # van de schil laat Tauri de gebouwde bundel inmetselen, en die staat
        # er in deze baan niet: hier draait geen node. --all-features zou hem
        # aanzetten en de analyse laten struikelen op een ontbrekende map. De
        # schil wordt daarom apart nagelopen, zonder die ene feature; wat zij
        # omzet is een cfg-vlag en geen code die anders wordt gelezen.
        run: |
          cargo clippy --workspace --all-targets --all-features \
            --exclude dpofg-schil -- -D warnings
          cargo clippy -p dpofg-schil --all-targets -- -D warnings

  tests:
    name: tests op ${{ matrix.os }}
    needs: opmaak-en-analyse
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # De workspace bevat sinds de grafische schil een Tauri-crate. Die bindt
      # tegen WebKitGTK, en zonder die koppen struikelt elke opdracht met
      # --workspace al bij glib-sys. Alleen op Linux: macOS levert WKWebView
      # mee en Windows haalt WebView2 zelf op.
      - name: systeembibliotheken voor de schil
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: bouwen
        run: cargo build --workspace --all-targets

      - name: tests
        run: cargo test --workspace

      - name: documentatievoorbeelden
        run: cargo test --workspace --doc

  afhankelijkheden:
    name: afhankelijkheden en licenties
    needs: opmaak-en-analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo-deny installeren
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  materiaallijst:
    name: softwarestuklijst
    needs: opmaak-en-analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo-cyclonedx installeren
        run: cargo install cargo-cyclonedx --locked

      - name: stuklijst opstellen
        run: cargo cyclonedx --all --format json

      - name: stuklijst bewaren
        uses: actions/upload-artifact@v4
        with:
          name: softwarestuklijst
          path: "**/*.cdx.json"
          if-no-files-found: error

  schil:
    name: de grafische schil
    needs: opmaak-en-analyse
    runs-on: ubuntu-latest
    # Ruimer dan de andere banen, en dat is geen slordigheid. Deze baan doet
    # drie dingen achter elkaar die elk minuten kosten: node klaarzetten, de
    # webviewmotoren van Playwright binnenhalen, en de Tauri-binary bouwen. Op
    # vijfentwintig minuten werd de laatste stap afgekapt terwijl alles ervoor
    # groen was, en dat leest als een fout in de code.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: schil
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm klaarzetten
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: afhankelijkheden installeren
        run: pnpm install --frozen-lockfile

      - name: typecontrole
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: eenheidstests
        run: pnpm exec vitest run

      - name: bouwen
        run: pnpm exec vite build

      # De bundel wordt nagelopen op wat het contentbeveiligingsbeleid niet
      # toestaat. Dit is uitdrukkelijk een vangnet en geen bewijs: de
      # motortests hieronder draaien op de echte motoren en die tellen.
      - name: de bundel nalopen
        run: |
          set -euo pipefail
          for ingang in dist/index.html dist/fg.html; do
            if grep -qE "<script>|<style" "$ingang"; then
              echo "::error::er staat een inline script of een inline stijl in $ingang"
              exit 1
            fi
          done
          for patroon in "eval(" "new Function" "fetch(" "XMLHttpRequest" \
                         "WebSocket" "EventSource" "WebAssembly" "setInterval" \
                         "createObjectURL" "structuredClone"; do
            if grep -qF "$patroon" dist/assets/*.js; then
              echo "::error::'$patroon' staat in de bundel en hoort daar niet"
              exit 1
            fi
          done
          if grep -qE 'url\(data:|@import' dist/assets/*.css; then
            echo "::error::de stijlen halen iets van buiten of lijnen een bestand in"
            exit 1
          fi
          echo "de bundel is schoon"

      - name: motoren klaarzetten
        run: pnpm exec playwright install --with-deps chromium webkit

      # WebKit is de motor die er het meest toe doet: hij benadert zowel
      # WKWebView op macOS als WebKitGTK op Linux. Daardoor breekt een
      # wijziging hier al voordat er een macOS-bouw bestaat.
      - name: motortests
        run: pnpm exec playwright test

      # Uitdrukkelijk mét custom-protocol: dat is de bouw die geïnstalleerd
      # wordt. Zonder die feature haalt de schil zijn scherm bij een
      # ontwikkelserver op en toont een geïnstalleerd programma bij het starten
      # alleen "Connection refused" — aan de binary is dat verschil niet te
      # zien, dus het wordt hier nagerekend.
      - name: bouw van de schilbinary zoals hij wordt geïnstalleerd
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
          cargo build -p dpofg-schil --features dpofg-schil/custom-protocol
          ./target/debug/dpofg-schil --stand

  netwerkstilte:
    name: geen uitgaand netwerkverkeer
    needs: opmaak-en-analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: bouwen
        # Alleen de opdrachtregel: deze baan draait `dpofg` onder strace en
        # heeft de grafische schil niet nodig. Dat scheelt de GTK-koppen en de
        # bouwtijd die daarbij hoort.
        run: cargo build -p dpofg-cli

      - name: netwerkgereedschap installeren
        # De enige stap in deze bouwstraat die zelf het netwerk op moet, en
        # daarmee de enige die op een trage spiegelserver kan blijven staan.
        #
        # Drie maatregelen, in deze volgorde. Eerst kijken of strace er al
        # staat: op de gangbare uitvoeromgeving is dat zo, en dan hoeft deze
        # baan het netwerk helemaal niet op. Daarna per poging een eigen
        # tijdslimiet, want zonder die limiet kan één hangende spiegelserver
        # het hele budget van de stap opeten en komt de tweede poging er nooit.
        # De limiet op de stap blijft er als laatste vangnet.
        #
        # libcap2-bin is hier weggelaten: dat pakket werd geïnstalleerd maar
        # nergens gebruikt, en het verdubbelde de kans dat deze stap op een
        # trage spiegelserver bleef staan.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if command -v strace > /dev/null; then
            echo "strace staat er al; deze baan hoeft het netwerk niet op"
            exit 0
          fi
          for poging in 1 2 3; do
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq strace; then
              exit 0
            fi
            echo "poging $poging mislukt of duurde te lang; opnieuw over 15 seconden"
            sleep 15
          done
          echo "::error::strace kon niet worden geïnstalleerd; de egresscontrole is niet gedraaid"
          exit 1

      - name: controleren dat het programma geen verbinding opent
        # De belofte "geen egress" is een van de drie kernbeloften uit het plan.
        # Een belofte die niet wordt nagerekend, is een marketingtekst.
        run: |
          set -euo pipefail
          export DPOFG_WACHTWOORD="een voldoende lange wachtwoordzin voor de bouwstraat"
          export DPOFG_KLUIS="$RUNNER_TEMP/proef.dpofg"

          strace -f -e trace=network -o "$RUNNER_TEMP/netwerk.log" \
            ./target/debug/dpofg kluis nieuw --licht > /dev/null

          strace -f -e trace=network -o "$RUNNER_TEMP/netwerk2.log" \
            ./target/debug/dpofg register nieuw X Y --eigenaar Z > /dev/null

          # De sleutelopdracht opent de kluis alleen-lezen en zonder wachtwoord;
          # juist zo'n afwijkend pad verdient de controle.
          strace -f -e trace=network -o "$RUNNER_TEMP/netwerk3.log" \
            ./target/debug/dpofg kluis sleutel > /dev/null

          # socket() naar een netwerkfamilie is de aanwijzing waar het om gaat.
          # AF_UNIX-sockets zijn lokaal en tellen niet mee.
          if grep -E 'socket\(AF_INET|socket\(AF_INET6|connect\(' \
               "$RUNNER_TEMP/netwerk.log" "$RUNNER_TEMP/netwerk2.log" \
               "$RUNNER_TEMP/netwerk3.log"; then
            echo "::error::het programma opent een netwerkverbinding; dat hoort niet te kunnen"
            exit 1
          fi
          echo "geen netwerkaanroepen aangetroffen"

      - name: opname bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netwerkopname
          path: ${{ runner.temp }}/netwerk*.log
          if-no-files-found: warn
