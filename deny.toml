# Beleid voor afhankelijkheden.
#
# Uitgangspunt: elke afhankelijkheid is aanvalsoppervlak dat iemand anders
# beheert. Een nieuwe afhankelijkheid vereist een geschreven motivering in de
# wijzigingsaanvraag; dit bestand maakt dat afdwingbaar.

[graph]
all-features = true

[advisories]
# Bekende kwetsbaarheden en niet meer onderhouden crates zijn fouten.
yanked = "deny"
# Zestien meldingen uit de afhankelijkheden van Tauri v2, alle van het type
# `unmaintained` en geen enkele een kwetsbaarheid. Zij staan hier stuk voor
# stuk met naam, want een uitzondering die niet is opgeschreven is over een
# jaar niet meer te onderscheiden van een vergissing.
#
# De GTK3-bindingen komen mee doordat Tauri v2 op Linux `webkit2gtk-4.1`
# gebruikt, en dat is GTK3. Daar is binnen de vastgelegde techniekkeuze niets
# aan te doen; het wachten is op de GTK4-overgang van Tauri zelf.
#
# Wat deze uitzondering níet doet: een échte kwetsbaarheid doorlaten. Een
# melding van het type `vulnerability` laat de bouwstraat nog altijd vastlopen.
# Deze lijst wordt bij elke uitgave nagelopen.
ignore = [
    # gtk-rs GTK3-bindingen, via tauri en wry.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error, via de macro's van gtk-rs.
    "RUSTSEC-2024-0370",
    # De unic-pakketten, via de domeinnaamverwerking onder Tauri.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
# Een expliciete lijst, geen uitsluitingslijst: een onbekende licentie hoort
# een besluit te vergen, niet stilzwijgend door te glippen. De lijst bevat
# uitsluitend licenties die in de huidige graaf voorkomen; een licentie die er
# niet in staat laat de bouwstraat vastlopen, en dat is de bedoeling. Ook een
# ongebruikte toestemming is een waarschuwing, en waarschuwingen die blijven
# staan leren iedereen waarschuwingen negeren.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # Zwak, bestandsgebonden copyleft. Komt binnen via de opmaakketen onder
    # Tauri (cssparser, dtoa-short, option-ext). Toegestaan omdat de
    # verplichting zich beperkt tot de bestanden van die pakketten zelf en wij
    # die niet wijzigen; zouden wij dat wel doen, dan hoort dat besluit hier
    # te worden herzien.
    "MPL-2.0",
    # Toegeeflijk, vergelijkbaar met MIT. Komt binnen via foldhash onder Tauri.
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# De eigen crates dragen `LicenseRef-Proprietary` en zijn `publish = false`.
# Dat is geen licentiekeuze over andermans code maar eigendom van dit product;
# de controle hierboven gaat over wat er van buiten binnenkomt.
ignore = true

[bans]
# Twee versies van dezelfde crate betekenen twee keer patchen bij een lek, en
# bij crypto-crates twee verschillende implementaties in hetzelfde proces.
multiple-versions = "warn"
wildcards = "deny"
# De interne crates verwijzen naar elkaar met een pad en zonder versie. Een
# versienummer op twee plaatsen bijhouden levert geen enkele bescherming op
# zolang niets van dit alles wordt gepubliceerd; het wildcardverbod blijft
# staan voor alles wat wél van buiten komt.
allow-wildcard-paths = true
highlight = "all"

[[bans.deny]]
# Deze crates zijn niet meer onderhouden of hebben een bekende opvolger.
name = "openssl"
reason = "dit product gebruikt geen OpenSSL; alle cryptografie loopt via gepinde Rust-crates"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
