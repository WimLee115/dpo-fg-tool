[workspace]
resolver = "2"
members = [
    "crates/dpofg-crypto",
    "crates/dpofg-audit",
    "crates/dpofg-terms",
    "crates/dpofg-domain",
    "crates/dpofg-store",
    "crates/dpofg-content",
    "crates/dpofg-rules",
    "crates/dpofg-report",
    "crates/dpofg-verify",
    "crates/dpofg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["WimLee115"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/WimLee115/dpo-fg-tool"

[workspace.dependencies]
# --- interne crates ---
dpofg-crypto  = { path = "crates/dpofg-crypto" }
dpofg-audit   = { path = "crates/dpofg-audit" }
dpofg-terms   = { path = "crates/dpofg-terms" }
dpofg-domain  = { path = "crates/dpofg-domain" }
dpofg-store   = { path = "crates/dpofg-store" }
dpofg-content = { path = "crates/dpofg-content" }
dpofg-rules   = { path = "crates/dpofg-rules" }
dpofg-report  = { path = "crates/dpofg-report" }

# --- cryptografie ---
argon2             = "0.5"
chacha20poly1305   = "0.10"
blake3             = "1"
ed25519-dalek      = { version = "2", features = ["rand_core", "pkcs8"] }
rand               = "0.8"
rand_core          = "0.6"
zeroize            = { version = "1", features = ["derive"] }
subtle             = "2"
hmac               = "0.12"
sha2               = "0.10"

# --- opslag ---
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "blob"] }

# --- serialisatie en tijd ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde", "clock"] }
chrono-tz  = "0.10"
uuid       = { version = "1", features = ["v4", "v7", "serde"] }
hex        = "0.4"
base64     = "0.22"

# --- fouten en hulpmiddelen ---
thiserror = "2"
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile  = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dev]
overflow-checks = true
