[package]
name = "dpofg-schil"
description = "De grafische schil van dpo-fg-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "dpofg_schil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dpofg-schil"
path = "src/main.rs"

# Zonder deze feature is `tauri::is_dev()` altijd waar en haalt de schil zijn
# scherm bij de ontwikkelserver op localhost in plaats van uit de ingebouwde
# bundel. Een geïnstalleerd programma dat dat doet, toont bij het starten
# alleen "Connection refused". De bouwstraat en beide beheerscripts zetten hem
# daarom aan; alleen een ontwikkelsessie met de vite-server laat hem weg.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dpofg-audit.workspace = true
dpofg-domain.workspace = true
dpofg-store.workspace = true
dpofg-rules.workspace = true
dpofg-report.workspace = true
dpofg-content.workspace = true
dpofg-terms.workspace = true
dpofg-crypto.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
